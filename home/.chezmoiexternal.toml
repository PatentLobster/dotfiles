# Global Claude Code skills pulled from anthropics/skills.
# include patterns match the FULL archive path (before stripComponents); the leading
# "*/" matches the top-level "skills-main/" dir. stripComponents=2 drops "skills-main/skills/"
# so each skill lands at ~/.claude/skills/<name>/.
# `exact` is intentionally omitted so locally-created skills under ~/.claude/skills are left untouched.
[".claude/skills"]
    type = "archive"
    url = "https://github.com/anthropics/skills/archive/refs/heads/main.tar.gz"
    stripComponents = 2
    refreshPeriod = "168h"
    include = ["*/skills/skill-creator/**", "*/skills/claude-api/**"]

# Extra skills pulled from mattpocock/skills, pinned to a known-good commit.
# The archive layout is skills-<sha>/skills/<category>/<name>/, so stripComponents=4
# drops the archive root, "skills", the category, and the skill dir name, landing
# each skill's contents directly at ~/.claude/skills/<name>/.
# Renovate keeps the pinned SHA current (see renovate.json customManager).
[".claude/skills/grill-me"]
    type = "archive"
    url = "https://github.com/mattpocock/skills/archive/e9dea692fd623e1717e63bdc81662c429a8e7062.tar.gz"
